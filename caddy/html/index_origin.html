<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kland PI Service</title>
  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="icon" href="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f4bb.png" type="image/png">

  <style>
    /* Reset & base */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      /* Simple gradient background */
      background: linear-gradient(135deg, #e0f7fa, #80deea);
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .container {
      background: rgba(255, 255, 255, 0.85);
      max-width: 800px;
      width: 100%;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    h1 {
      margin-bottom: 1.5rem;
      font-size: 2rem;
      color: #00796b;
    }

    /* Service buttons grid */
    .services {
      list-style: none;
      display: grid;
      gap: 1rem;
      /* 1 column on small, auto-fit on larger */
      grid-template-columns: 1fr;
    }

    @media (min-width: 600px) {
      .services {
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      }
    }

    /* Button styling */
    .services li a {
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      background: #00796b;
      color: white;
      padding: 1rem;
      border-radius: 0.5rem;
      font-size: 1.1rem;
      transition: background 0.2s ease;
    }

    .services li a:hover {
      background: #004d40;
    }

    /* Icon styling */
    .services li a .material-icons {
      font-size: 1.4rem;
      margin-right: 0.5rem;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Kland PI Service</h1>
    <ul class="services">
      <li>
        <a href="http://home-pi.local:8080/" target="_blank" rel="noopener">
          <span class="material-icons">folder_open</span>
          FileBrowser
        </a>
      </li>
      <li>
        <a href="http://home-pi.local/qbittorrent/" target="_blank" rel="noopener">
          <span class="material-icons">cloud_download</span>
          qBittorrent
        </a>
      </li>
      <li>
        <a href="https://home-pi.local:9090/metrics" target="_blank" rel="noopener">
          <span class="material-icons">analytics</span>
          Monitor
        </a>
      </li>
      <li>
        <a href="http://home-pi.local:9000/#!/home" target="_blank" rel="noopener">
          <span class="material-icons">dashboard</span>
          Portainer
        </a>
      </li>
      <li>
        <a href="http://home-pi.local:6001" target="_blank" rel="noopener">
          <span class="material-icons">storage</span>
          MinIO
        </a>
      </li>
      <li>
        <a href="http://home-pi.local:8123" target="_blank" rel="noopener">
          <span class="material-icons">home</span>
          Home Assistant
        </a>
      </li>
    </ul>
  </div>
</body>

</html>
